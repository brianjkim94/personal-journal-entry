databases:
  - name: journaldb
    plan: free
    databaseName: digital_journal_app
    user: digital_journal_app_user

services:
  - type: web
    plan: free
    name: journaldb
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "python -m gunicorn journal_project.asgi:application -k uvicorn.workers.UvicornWorker"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: digital_journal_app
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4 
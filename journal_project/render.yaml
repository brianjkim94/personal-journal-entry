databases:
  - name: journal-project
    plan: free
    databaseName: journal_project
    user: journal_project_user

services:
  - type: web
    plan: free
    name: journal-project
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "python -m gunicorn journal_project.asgi:application -k uvicorn.workers.UvicornWorker"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: journal_project
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4 